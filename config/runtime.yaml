# Runtime Configuration for Realtime VSL Recognition System
paths:
  project_root: "."
  asset_root: "VSL400_System_Assets"
  checkpoint_path: "VSL400_System_Assets/VSL400_11_MULTISEED_TCN_TRANSFORMER/checkpoints/best_seed_20260827.pt"
  label_map_path: "VSL400_System_Assets/VSL400_COMBINE_5GROUPS_Shared_Keypoints/label_map.json"
  extractor_config_path: "VSL400_System_Assets/VSL400_COMBINE_5GROUPS_Shared_Keypoints/extractor_config.json"

model:
  device: "auto"  # 'cuda', 'cpu', or 'auto'
  cpu_num_threads: 2  # Prevents OpenMP-XNNPACK CPU thread contention during concurrent MediaPipe + PyTorch live inference
  input_dim: 294
  model_dim: 256
  tcn_layers: 4
  tcn_kernel_size: 5
  nhead: 8
  transformer_layers: 4
  ff_dim: 768
  num_classes: 401
  blank_id: 400
  blank_bias_init: -1.5

camera:
  width: 640
  height: 480
  target_fps: 30
  jpeg_quality: 0.80
  mirror_preview: true

preprocessing:
  pose_visibility_threshold: 0.4
  pose_presence_threshold: 0.2
  min_scale: 0.0001
  shoulder_scale_multiplier: 1.0
  clip_value: 6.0
  n_joints: 42
  features_per_joint: 7

mediapipe:
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  pose_stride: 2
  roi_enabled: true
  roi_scale_multiplier: 4.0

buffer:
  max_frames: 90
  min_frames: 10
  max_utterance_frames: 450  # Supports full 1-5 gloss continuous utterances (up to ~15-18s) without silent tail drop
  inference_stride: 4  # Async live inference every 4 frames (~4-7 updates/sec) for responsive live gloss

endpoint:
  enabled: true
  motion_threshold: 0.008
  min_sign_duration_ms: 240
  possible_end_delay_ms: 600
  silence_ms: 1100
  cooldown_ms: 200  # Reduced from 400ms (FIX-10) so rapid 3x repeated short signs are not clipped at onset
  hands_lowered_possible_end_ms: 180
  hands_lowered_commit_ms: 350
  starting_abort_ms: 220

display:
  draw_hands: true
  draw_pose: false
  show_fps: true

llm:
  enabled: false
  provider: "none"  # 'none', 'gemini', 'ollama', 'openai'
  api_key: ""
  model_name: "gemini-3.5-flash-lite"
  endpoint_url: ""

